<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- WSLg GUI apps: JetBrainsMono as the default UI font (menus, dialogs, title bars) -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <!-- Rendering closer to Windows ClearType: subpixel RGB + light hinting -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
