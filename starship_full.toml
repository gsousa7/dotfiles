# Starship Full configuration

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_bg1)\
$os\
$username\
[](fg:color_bg1 bg:color_bg2)\
$directory\
[](fg:color_bg2 bg:color_bg3)\
$git_branch\
$git_status\
$git_state\
[](fg:color_bg3 bg:color_bg4)\
$python\
[](fg:color_bg4 bg:color_bg5)\
$kubernetes\
[](fg:color_bg5 bg:color_bg6)\
$cmd_duration\
$status\
[ ](fg:color_bg6)\
"""

# Starship color legend
## color_txt - text color
## color_bg1 - 1st color block
## color_bg2 - 2nd color block
## color_bg3 - 3rd color block
## color_bg4 - 4th color block
## color_bg5 - 5th color block
## color_bg6 - 6th color block


palette = "gruvbox_dark"

[palettes.gruvbox_dark]
color_txt = '#fbf1c7'
color_bg1 = '#d65d0e'
color_bg2 = '#d79921'
color_bg3 = '#689d6a'
color_bg4 = '#458588'
color_bg5 = '#665c54'
color_bg6 = '#3c3836'

[os]
disabled = false
style = "bg:color_bg1 fg:color_txt"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_bg1 fg:color_txt"
style_root = "bg:color_bg1 fg:color_txt"
format = '[ $user ]($style)'

[directory]
style = "fg:color_txt bg:color_bg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "󰋞 "

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = ""
"/git" = "/"
"Projects" = ""
"Videos" = "󰕧"
"Desktop" = ""
"/scripts/" = "/󰲋/"
'/work/' = "//"
"/lab/" = "/ /"


[git_branch]
symbol = ""
style = "fg:color_txt bg:color_bg3"
format = '[ $symbol $branch ]($style)'


[git_status]
style = "fg:color_txt bg:color_bg3"
format = '[($all_status$ahead_behind )]($style)'
conflicted = ' ${count} '
up_to_date = '󰘽'
untracked = '󰋗 ${count} '
ahead = ' ${count}'
diverged = ' ${ahead_count}  ${behind_count}'
behind = ' ${count}'
stashed = ' ${count} '
modified = '󰛿 ${count} '
staged = '󰐗 ${count} '
renamed = '󱍸 ${count} '
deleted = '󰍶 ${count} '


[git_state]
style = "fg:color_txt bg:color_bg3"
format = '[ $state( $progress_current/$progress_total) ]($style)'

[python]
symbol = ""
style = "fg:color_txt bg:color_bg4"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "fg:color_txt bg:color_bg5"
format = '[ $symbol( $context) ]($style)'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[conda]
style = "fg:color_txt bg:color_bg5"
format = '[ $symbol( $environment) ]($style)'

[kubernetes]
symbol = "☸"
style = "fg:color_txt bg:color_bg4"
format = '[[ $symbol $context ($cluster:$namespace) ]($style)]'
disabled = false

[aws]
symbol = "☁️"
style = "fg:color_txt bg:color_bg5"
format = '[ $symbol ($profile:$region) ]($style)'

[azure]
symbol = "󰠅"
style = "fg:color_txt bg:color_bg5"
format = '[ $symbol ($subscription/$tenant) ]($style)'

[status]
style = "bg:color_bg6 fg:color_txt"
format = '[ ↵ $status ]($style)'
disabled = false
map_symbol = true

[cmd_duration]
min_time = 500
style = "bg:color_bg6 fg:color_txt"
format = '[ $duration ]($style)'

[character]
continuation_symbol = "[↪](bold color_bg2)"
